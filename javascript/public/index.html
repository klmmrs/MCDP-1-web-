<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MCDP</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="main-content">

        <h1>MCDP</h1>

        <h4>Add interval files (Ref & Query)</h4>

        <div class="hidden-input">
            <label for="fileInput1">Reference intervals:</label>
            <input type="file" id="fileInput1" accept=".bed,.txt,.tsv">
        </div>

        <div class="hidden-input">
            <label for="fileInput2">Query intervals:</label>
            <input type="file" id="fileInput2" accept=".bed,.txt,.tsv">
        </div>

        <div>
            <h4>Add chromosome length file</h4>

            <div class="hidden-input">
                <label for="fileInputLength">Chromosome sizes:</label>
                <input type="file" id="fileInputLength" accept=".txt,.tsv">
            </div>
        </div>

        <div style="margin-top: 20px;">
            <button type="button" id="submit-btn" disabled>
                Calculate
            </button>
        </div>

        <div id="status" style="margin-top: 15px;">Waiting for files...</div>
        <pre id="output" style="margin-top: 15px; color: beige; white-space: pre-wrap;"></pre>

    </div>

    <script src="app.js"></script>

</body>
</html>
